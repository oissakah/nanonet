[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanonet"
version = "0.2.0"
description = "Graph-based nanoparticle necklace network simulator: generation, I-V analysis, and parameter sweeps"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "pandas",
    "matplotlib",
    "PyYAML",
    "plotly",
    "dash",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["nanonet*"]
